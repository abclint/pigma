# Minimal ALSA config for statically-linked musl builds.
# Only uses ALSA built-in plugins (plug/hw) so no external PipeWire/PulseAudio
# plugins need to be dlopen'd at runtime. Uses the default card instead of
# hardcoding card 0 (which may not exist on PipeWire-only systems).
pcm.!default {
    type plug
    slave.pcm "hw"
}

ctl.!default {
    type hw
}
