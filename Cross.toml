[target.aarch64-unknown-linux-gnu]
pre-build = [
    "dpkg --add-architecture $CROSS_DEB_ARCH",
    "apt-get update && apt-get --assume-yes install libasound2-dev:$CROSS_DEB_ARCH",
]

[target.aarch64-unknown-linux-musl]
pre-build = ["""
set -eux
SYSROOT="/usr/local/aarch64-linux-musl"
ALSA_VERSION="1.2.13"
ALSA_URL="https://github.com/alsa-project/alsa-lib/releases/download/v${ALSA_VERSION}/alsa-lib-${ALSA_VERSION}.tar.bz2"
apt-get update
apt-get install --assume-yes --no-install-recommends wget make
cd /tmp
wget -q "$ALSA_URL"
tar xf "alsa-lib-${ALSA_VERSION}.tar.bz2"
cd "alsa-lib-${ALSA_VERSION}"
export CC="aarch64-linux-musl-gcc"
export CFLAGS="-fPIC"
./configure --host=aarch64-linux-musl --prefix="$SYSROOT" --enable-static --disable-shared --disable-python --without-versioned
make -j"$(nproc)"
make install
ls "$SYSROOT/lib/pkgconfig/alsa.pc"
"""]
