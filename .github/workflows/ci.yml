name: CI

on:
  pull_request:
    paths-ignore:
      - 'README.md'
  push:
    branches:
      - main
      - master
      - develop
    paths-ignore:
      - 'README.md'

env:
  CARGO_TERM_COLOR: always

# ensure that the workflow is only triggered once per PR, subsequent pushes to the PR will cancel
# and restart the workflow. See https://docs.github.com/en/actions/using-jobs/using-concurrency
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: check formatting
        run: cargo fmt -- --check
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
  clippy:
    name: clippy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install Linux audio dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev
      - name: Run clippy action
        uses: clechasseur/rs-clippy-check@v5
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
  build-aarch64:
    name: build linux/aarch64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Build for aarch64-unknown-linux-gnu
        uses: houseabsolute/actions-rust-cross@v0
        env:
          PKG_CONFIG_ALLOW_CROSS: '1'
          PKG_CONFIG_PATH: '/usr/lib/aarch64-linux-gnu/pkgconfig'
        with:
          target: aarch64-unknown-linux-gnu
          command: build
          args: '--locked'
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
  build-aarch64-musl:
    name: build linux/aarch64/musl
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Build for aarch64-unknown-linux-musl
        uses: houseabsolute/actions-rust-cross@v0
        env:
          PKG_CONFIG_ALLOW_CROSS: '1'
          PKG_CONFIG_PATH: '/usr/local/aarch64-linux-musl/usr/lib/pkgconfig'
        with:
          target: aarch64-unknown-linux-musl
          command: build
          args: '--locked'
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
  build-x86_64-musl:
    name: build linux/x86_64/musl
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install musl-tools and build ALSA
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools wget make
          SYSROOT="/usr/local/x86_64-linux-musl"
          sudo mkdir -p "$SYSROOT"
          sudo chown -R $USER "$SYSROOT"
          ALSA_VERSION="1.2.16.1"
          ALSA_URL="https://www.alsa-project.org/files/pub/lib/alsa-lib-${ALSA_VERSION}.tar.bz2"
          cd /tmp
          wget -q "$ALSA_URL"
          tar xf "alsa-lib-${ALSA_VERSION}.tar.bz2"
          cd "alsa-lib-${ALSA_VERSION}"
          export CC="musl-gcc"
          export CFLAGS="-fPIC"
          ./configure --host=x86_64-linux-musl --prefix="$SYSROOT/usr" --enable-static --disable-shared --disable-python --without-versioned
          make -j"$(nproc)"
          make install

      - name: Build for x86_64-unknown-linux-musl
        uses: houseabsolute/actions-rust-cross@v0
        env:
          PKG_CONFIG_ALLOW_CROSS: '1'
          PKG_CONFIG_PATH: '/usr/local/x86_64-linux-musl/usr/lib/pkgconfig'
        with:
          target: x86_64-unknown-linux-musl
          command: build
          args: '--locked'

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
  test:
    runs-on: ${{ matrix.os }}
    name: test ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      # if your project needs OpenSSL, uncomment this to fix Windows builds.
      # it's commented out by default as the install command takes 5-10m.
      # - run: echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Append
      #   if: runner.os == 'Windows'
      # - run: vcpkg install openssl:x64-windows-static-md
      #   if: runner.os == 'Windows'
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      # enable this ci template to run regardless of whether the lockfile is checked in or not
      - name: cargo generate-lockfile
        if: hashFiles('Cargo.lock') == ''
        run: cargo generate-lockfile
      - name: cargo test --locked
        run: cargo test --locked --all-features
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
